spring:
  application:
    name: sb15-monew-team02
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

management:
  health:
    # MongoDB는 아직 사용하지 않고 docker-compose에도 없어서, 헬스체크에서 제외 (사용 시 다시 활성화)
    mongodb:
      enabled: false
