spring:
  application:
    name: sb15-monew-team02
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true