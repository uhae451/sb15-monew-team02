spring:
  application:
    name: sb15-monew-team02
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

  # Spring Batch 설정
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

# 뉴스 수집 Scheduler 설정
monew:
  news:
    scheduler:
      enabled: false